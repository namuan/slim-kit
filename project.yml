name: SlimKit
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  SlimKit:
    type: application
    platform: macOS
    sources:
      - path: Sources/SlimKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slimkit.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: SlimKit accesses your Photos library so you can browse and locally compress selected photos and videos.
        CODE_SIGN_ENTITLEMENTS: Sources/SlimKit/SlimKit.entitlements
        ENABLE_APP_SANDBOX: YES
  SlimKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SlimKitTests
    dependencies:
      - target: SlimKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slimkit.tests
        GENERATE_INFOPLIST_FILE: YES
